apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: vladibo/full-stack-devops
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "" # to do change to config map/ secrets
